services:
  app:
    build: .
    restart: unless-stopped
    environment:
      TRUST_PROXY: "1"
      RESERVED_USERNAME: ${RESERVED_USERNAME:-}
      PUBLIC_URL: https://${PUBLIC_IP:?Set PUBLIC_IP in .env}
    ports:
      - '127.0.0.1:8793:8787'
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  proxy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    environment:
      PUBLIC_IP: ${PUBLIC_IP:?Set PUBLIC_IP in .env}
    ports:
      - '443:443'
    volumes:
      - ./deploy/Caddyfile.ip:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true
    depends_on:
      app:
        condition: service_healthy
volumes:
  caddy-data:
  caddy-config:
