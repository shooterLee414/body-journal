services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PUBLIC_URL: http://127.0.0.1:8794
    ports:
      - '127.0.0.1:8793:8787'
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
